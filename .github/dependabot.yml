version: 2
updates:
  # GitHub Actions 版本扫描(每周)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "github-actions"
      - "dependencies"

  # Maven 依赖扫描(每周,分组)
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # 测试相关合并成一个 PR
      test-dependencies:
        patterns:
          - "org.junit.*"
          - "org.mockito*"
      # Spring Boot 系列合并(避免单独升级造成版本不一致)
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
